<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-label="Four-layer agent architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="100%" stop-color="#f3ecdc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="url(#bg)"/>

  <!-- Title strip -->
  <text x="460" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#6e6e6e" letter-spacing="2">FOUR-LAYER LOCALIZATION PIPELINE</text>

  <!-- Input -->
  <g transform="translate(20, 60)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" font-family="monospace" font-weight="700" font-size="11" fill="#c0392b">INPUT</text>
    <text x="80" y="48" text-anchor="middle" font-family="serif" font-weight="700" font-size="22" fill="#1a1a1a">page.png</text>
    <text x="80" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6e6e6e">raw manga panel</text>
    <text x="80" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6e6e6e">JP source</text>
  </g>

  <!-- Layer 1: Perception -->
  <g transform="translate(220, 60)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#1f3b6f" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#1f3b6f"/>
    <text x="80" y="15" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff">01 · PERCEPTION</text>
    <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#1a1a1a">OCR + bubble mask</text>
    <text x="80" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">tesseract-jp</text>
    <text x="80" y="78" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">manga-bbox-cv</text>
    <text x="80" y="94" text-anchor="middle" font-family="monospace" font-size="10" fill="#27ae60">cheap tier</text>
  </g>

  <!-- Layer 2: Translation -->
  <g transform="translate(420, 60)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#1d6f47" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#1d6f47"/>
    <text x="80" y="15" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff">02 · TRANSLATION</text>
    <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#1a1a1a">raw + context</text>
    <text x="80" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">prev-3-panel cache</text>
    <text x="80" y="78" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">honorific-mapper</text>
    <text x="80" y="94" text-anchor="middle" font-family="monospace" font-size="10" fill="#27ae60">cheap tier</text>
  </g>

  <!-- Layer 3: Cultural transcreation -->
  <g transform="translate(620, 60)">
    <rect width="160" height="100" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#e67e22"/>
    <text x="80" y="15" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff">03 · TRANSCREATION</text>
    <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#1a1a1a">SFX + idiom + joke</text>
    <text x="80" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">cultural-ref-db</text>
    <text x="80" y="78" text-anchor="middle" font-family="monospace" font-size="10" fill="#6e6e6e">pun-reconstructor</text>
    <text x="80" y="94" text-anchor="middle" font-family="monospace" font-size="10" fill="#e67e22">smart tier</text>
  </g>

  <!-- Layer 4: Typesetting -->
  <g transform="translate(820, 60)">
    <rect width="80" height="100" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="40" y="22" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#c0392b">OUTPUT</text>
    <text x="40" y="48" text-anchor="middle" font-family="serif" font-weight="700" font-size="14" fill="#1a1a1a">page</text>
    <text x="40" y="64" text-anchor="middle" font-family="serif" font-weight="700" font-size="14" fill="#1a1a1a">_en.png</text>
    <text x="40" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6e6e6e">+id +cn</text>
  </g>

  <!-- Arrows between layers -->
  <line x1="180" y1="110" x2="220" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="110" x2="420" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="110" x2="620" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="110" x2="820" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4 detail (typesetting) -->
  <g transform="translate(220, 200)">
    <rect width="560" height="100" rx="6" fill="#ffffff" stroke="#8b1f1f" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="22" rx="6" fill="#8b1f1f"/>
    <text x="280" y="15" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff">04 · TYPESETTING (post-transcreation, all layers feed through)</text>

    <g transform="translate(20, 36)">
      <text x="0" y="14" font-family="sans-serif" font-weight="700" font-size="11" fill="#1a1a1a">bubble fit</text>
      <text x="0" y="30" font-family="monospace" font-size="10" fill="#6e6e6e">text-area vs polygon</text>
      <text x="0" y="46" font-family="monospace" font-size="10" fill="#27ae60">cheap tier</text>
    </g>

    <g transform="translate(160, 36)">
      <text x="0" y="14" font-family="sans-serif" font-weight="700" font-size="11" fill="#1a1a1a">font matching</text>
      <text x="0" y="30" font-family="monospace" font-size="10" fill="#6e6e6e">Wild Words / Mangat</text>
      <text x="0" y="46" font-family="monospace" font-size="10" fill="#27ae60">cheap tier</text>
    </g>

    <g transform="translate(300, 36)">
      <text x="0" y="14" font-family="sans-serif" font-weight="700" font-size="11" fill="#1a1a1a">SFX styling</text>
      <text x="0" y="30" font-family="monospace" font-size="10" fill="#6e6e6e">italic + bold + skew</text>
      <text x="0" y="46" font-family="monospace" font-size="10" fill="#e67e22">smart tier</text>
    </g>

    <g transform="translate(420, 36)">
      <text x="0" y="14" font-family="sans-serif" font-weight="700" font-size="11" fill="#1a1a1a">RTL→LTR flip</text>
      <text x="0" y="30" font-family="monospace" font-size="10" fill="#6e6e6e">panel-order reverse</text>
      <text x="0" y="46" font-family="monospace" font-size="10" fill="#27ae60">cheap tier</text>
    </g>
  </g>

  <!-- Cost-tier summary box -->
  <g transform="translate(220, 330)">
    <rect width="560" height="100" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#1a1a1a">Cost-tier routing — 80/20 split</text>

    <rect x="20" y="36" width="416" height="20" fill="#27ae60" rx="3"/>
    <rect x="436" y="36" width="104" height="20" fill="#e67e22" rx="3"/>

    <text x="40" y="50" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">~80% cheap (OCR · raw translate · format · bubble fit · RTL flip)</text>
    <text x="450" y="50" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">~20% smart</text>

    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#6e6e6e">Smart tier = cultural transcreation, joke reconstruction, SFX onomatopoeia mapping.</text>
    <text x="20" y="94" font-family="sans-serif" font-size="11" fill="#6e6e6e">Per-page cost: ~$0.005-0.012. Practical for fan-scanlation, viable for studio batches.</text>
  </g>

  <!-- Arrows down to typesetting -->
  <line x1="300" y1="160" x2="300" y2="200" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="500" y2="200" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="700" y2="200" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>
